name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Test & Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          check-latest: true
          cache: true # Ensures Go modules are cached between runs

      - name: Verify Go Workspace
        run: go work sync

      - name: Test pkg module
        run: |
          cd pkg
          go test -v -coverprofile=coverage.out ./...

      - name: Test penne-service module
        run: |
          cd src/penne-service
          go test -v -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out

      - name: Verify penne-service Coverage > 95%
        run: |
          cd src/penne-service
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Coverage is ${COVERAGE}%"
          awk -v cov="$COVERAGE" 'BEGIN { if (cov < 95.0) { print "Coverage below 95%: " cov "%"; exit 1 } else { print "Coverage threshold met: " cov "%" } }'

      - name: Upload Coverage Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            pkg/coverage.out
            src/penne-service/coverage.out

  deploy:
    name: Deploy to Tablet
    needs: test
    environment: Production
    # ONLY deploy when code is pushed to main. Do not deploy on Pull Requests.
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      # 1. Connect the GitHub runner to your private Tailscale network
      - name: Tailscale Connect
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      # 2. Securely SSH into the tablet and execute the deployment script
      - name: Execute Remote Deployment via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.TABLET_IP }}
          username: ${{ secrets.TABLET_USER }}
          key: ${{ secrets.TABLET_SSH_KEY }}
          port: 8022
          script: |
            ~/deploy.sh penne-service
